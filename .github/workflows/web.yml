name: web
# Publishes the browser version on GitHub Pages at every push to main (and
# by hand from the Actions tab). One-time setup: Settings -> Pages ->
# Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          GOOS=js GOARCH=wasm go vet ./internal/... ./cmd/web
          go test ./internal/...
      - name: Build the site
        run: make web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

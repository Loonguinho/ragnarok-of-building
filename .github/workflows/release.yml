name: release
# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds the
# Windows program and publishes it on the repository's Releases page.
# Only our code goes in: each player's copy reads the game data from their
# own RO LATAM client on first run.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        # Same tool as a local build: icon, version details, windowed (no console), zip.
        run: go run ./tools/buildexe -version "${GITHUB_REF_NAME}" -repo "${GITHUB_REPOSITORY}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.1.0-beta.1) is published as a pre-release.
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes $pre
